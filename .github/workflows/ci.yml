name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      # -tags audio_oto swaps the letgo binding's native output for let-go's
      # audio seam, so both builds are checked.
      - run: go test -tags audio_oto ./letgo
      # How the browser build picks let-go's audio seam over webaudio, under
      # node (the runner has it); the rest of letgo's tests are native-only
      # in what they check.
      - run: GOOS=js GOARCH=wasm go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -run SeamDevice ./letgo
      - run: go vet ./...
      - run: go vet -tags audio_oto ./...
      - run: GOOS=js GOARCH=wasm go vet ./examples/designer ./webaudio ./letgo
      # installed natively first: `go run` under GOOS=js would build the checker for js
      - run: GOBIN="$(go env GOPATH)/bin" go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
      - run: '"$(go env GOPATH)/bin/staticcheck" ./...'
      - run: '"$(go env GOPATH)/bin/staticcheck" -tags audio_oto ./...'
      - run: GOOS=js GOARCH=wasm "$(go env GOPATH)/bin/staticcheck" ./examples/designer ./webaudio ./letgo

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: js, goarch: wasm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Every package builds for js/wasm today, so ./... covers all three
      # targets. If a package becomes native-only, give it a !js build tag
      # rather than narrowing this list.
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        run: go build ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }} with -tags audio_oto
        run: go build -tags audio_oto ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # The grid example's lg mutate button is an opt-in build.
      - name: build the grid example with -tags lg
        if: matrix.goos == 'js'
        run: go build -tags lg ./examples/grid
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
